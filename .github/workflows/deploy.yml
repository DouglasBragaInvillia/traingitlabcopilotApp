name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create necessary directories
      run: |
        mkdir -p static/images
        mkdir -p templates
        echo "Creating placeholder files"
        touch static/images/travel-illustration.png
        touch static/images/travel-empty.png

    - name: Debug environment
      run: |
        echo "Current directory contents:"
        ls -la
        echo "Python version:"
        python --version

    - name: Deploy to Azure Web App using FTPS
      uses: SamKirkland/FTP-Deploy-Action@4.3.3
      with:
        server: waws-prod-cq1-043.ftp.azurewebsites.windows.net
        username: traingitlabcopilotApp\$traingitlabcopilotApp
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        local-dir: ./
        server-dir: site/wwwroot/